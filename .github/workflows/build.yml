name: Build & Release NetShare Direct APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/NetShareDirect.apk
          elif [ -f NetShareDirect.apk ]; then
            cp NetShareDirect.apk release-artifacts/NetShareDirect.apk
          fi
          echo "Release APK size: $(ls -lh release-artifacts/NetShareDirect.apk)"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetShareDirect-Release-APK
          path: release-artifacts/NetShareDirect.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts/NetShareDirect.apk
          name: "NetShare Direct ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
